<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IOI Sponsor Finder</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{--navy:#252525;--navy2:#2E2E2E;--navy3:#3C3C3C;--green:#4E73A7;--greend:#3E5E89;--gold:#9BD5FF;--ice:#CDD8E6;--mute:#8A8A8A}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Montserrat',-apple-system,Arial,sans-serif;background:transparent;color:#fff;padding:8px}
  .box{background:radial-gradient(900px 400px at 0% 0%,var(--navy3),var(--navy) 70%);border-radius:20px;padding:30px;max-width:900px;margin:0 auto}
  h2{font-size:24px;font-weight:800;margin-bottom:6px}
  .sub{color:var(--ice);font-size:14px;margin-bottom:22px}
  .controls{display:grid;grid-template-columns:1fr 1fr 1.4fr auto;gap:12px;align-items:end}
  .ctl{display:flex;flex-direction:column;gap:6px}
  label{color:var(--ice);font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase}
  input,select{padding:12px 13px;border-radius:10px;border:1px solid var(--navy3);background:var(--navy2);color:#fff;font-size:15px;font-weight:600;font-family:inherit}
  select{appearance:none;cursor:pointer}
  .btn{height:46px;padding:0 26px;border:none;border-radius:8px;background:var(--gold);color:#11222e;font-weight:700;font-size:14px;letter-spacing:.6px;text-transform:uppercase;cursor:pointer;white-space:nowrap}
  .btn:hover{background:#7fc4f5}
  .meta{color:var(--ice);font-size:14px;margin:20px 2px 14px;font-weight:600;min-height:20px}
  .meta b{color:var(--gold)}
  .results{display:flex;flex-direction:column;gap:11px}
  .rcard{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;background:rgba(255,255,255,.04);border:1px solid var(--navy3);border-radius:13px;padding:15px 18px}
  .rname{color:#fff;font-weight:700;font-size:16px}
  .rname a{color:#fff;text-decoration:none}
  .rname a:hover{color:var(--gold)}
  .rmeta{display:flex;flex-wrap:wrap;gap:7px;margin-top:7px}
  .chip{font-size:12px;font-weight:700;padding:4px 10px;border-radius:50px;background:rgba(155,213,255,.14);color:var(--gold)}
  .chip.gray{background:rgba(207,224,242,.12);color:var(--ice)}
  .chip a{color:inherit;text-decoration:none}
  .rright{text-align:right;min-width:118px}
  .fit{font-size:12px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:#11222e;background:var(--gold);padding:5px 12px;border-radius:50px;display:inline-block}
  .fit.med{background:var(--green);color:#fff}
  .rbudget{color:var(--ice);font-size:13px;margin-top:7px}
  .rbudget b{color:#fff}
  .legend{margin-top:20px;padding-top:16px;border-top:1px solid var(--navy3);color:var(--ice);font-size:12px;display:flex;flex-wrap:wrap;gap:7px;align-items:center}
  .legend b{color:#fff}
  .legend span{background:rgba(155,213,255,.12);color:var(--gold);border:1px solid var(--navy3);padding:4px 11px;border-radius:50px;font-weight:700}
  .err{color:#ffb4b4;font-size:14px;margin-top:14px}
</style>
</head>
<body>
<div class="box">
  <h2>See your local sponsors in seconds</h2>
  <div class="sub">Enter a zip and we'll surface the nearby businesses most likely to sponsor your club — ranked by Fit score.</div>

  <div class="controls">
    <div class="ctl"><label>Zip code</label><input id="f-zip" maxlength="5" placeholder="34236" value="34236"></div>
    <div class="ctl"><label>Radius</label>
      <select id="f-rad"><option value="10">10 mi</option><option value="20">20 mi</option><option value="30" selected>30 mi</option><option value="50">50 mi</option></select></div>
    <div class="ctl"><label>Industry</label>
      <select id="f-ind">
        <option value="">All industries</option>
        <option>Restaurant</option><option>Real Estate</option><option>Mortgage</option>
        <option>Attorney</option><option>Insurance</option><option>Auto Dealer</option>
        <option>Medical</option><option>Orthodontist</option><option>Fitness</option>
      </select></div>
    <button class="btn" id="f-go">Search</button>
  </div>

  <div class="meta" id="f-meta"></div>
  <div class="results" id="f-results"></div>
  <div class="err" id="f-err"></div>

  <div class="legend"><b>How Fit is scored —</b>
    <span>Industry 30%</span><span>Proximity 22%</span><span>Reputation 18%</span>
    <span>Web presence 15%</span><span>Reachable 15%</span>
  </div>
</div>

<script>
  const API_BASE = "";        // same Vercel project -> leave ""
  const RESULT_LIMIT = 25;    // how many ranked results to return

  const $ = id => document.getElementById(id);
  const fmt = n => "$" + Number(n).toLocaleString();

  function cardHTML(p){
    const nameHTML = p.website ? `<a href="${p.website}" target="_blank" rel="noopener">${p.name}</a>` : p.name;
    return `<div class="rcard">
      <div>
        <div class="rname">${nameHTML}</div>
        <div class="rmeta">
          <span class="chip">${p.industry}</span>
          ${p.reviews ? `<span class="chip gray">${p.reviews} reviews</span>` : ``}
          <span class="chip gray">${p.distance} mi away</span>
          ${p.phone ? `<span class="chip gray">${p.phone}</span>` : ``}
        </div>
      </div>
      <div class="rright">
        <span class="fit ${p.fit>=85?'':'med'}">Fit ${p.fit}</span>
        <div class="rbudget">Est. potential <b>${fmt(p.estBudget)}</b></div>
      </div>
    </div>`;
  }

  async function run(){
    const zip=($('f-zip').value||'').slice(0,5).trim();
    const rad=$('f-rad').value, ind=$('f-ind').value;
    $('f-err').textContent=''; $('f-results').innerHTML='';
    if(!/^\d{5}$/.test(zip)){ $('f-meta').textContent='Enter a 5-digit zip code.'; return; }
    $('f-meta').innerHTML='Searching local businesses…';
    try{
      const url=`${API_BASE}/api/search?zip=${zip}&radius=${rad}&limit=${RESULT_LIMIT}${ind?`&industry=${encodeURIComponent(ind)}`:''}`;
      const r=await fetch(url);
      const data=await r.json();
      if(!r.ok){ throw new Error(data.error||'Search failed'); }
      const list=data.results||[];
      if(list.length===0){ $('f-meta').textContent='No matches — try a wider radius or different industry.'; return; }
      $('f-meta').innerHTML=`Found <b>${data.total}</b> qualified prospects within ${rad} mi of ${zip} · showing ${list.length} · ranked by Fit score`;
      $('f-results').innerHTML=list.map(cardHTML).join('');
    }catch(e){
      $('f-meta').textContent='';
      $('f-err').textContent='Sorry — '+(e.message||'something went wrong')+'.';
    }
  }

  $('f-go').addEventListener('click', run);
  $('f-zip').addEventListener('keydown', e=>{ if(e.key==='Enter') run(); });
</script>
</body>
</html>
